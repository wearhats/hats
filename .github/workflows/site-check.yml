name: Site check

# Checks the deployed site from outside. A release job calls this directly,
# because release.yml un-drafts with github.token and that starts no workflows.
# The schedule waits for the SITE_CHECK_ENABLED variable, so merging this before
# the first deploy doesn't open an issue a day.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule' || vars.SITE_CHECK_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Check the live site
        run: node site/scripts/live-check.mjs | tee "$RUNNER_TEMP/site-check.txt"
        shell: bash -o pipefail -e {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Site check failed"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          { echo "$RUN_URL"; echo; echo '```'; cat "$RUNNER_TEMP/site-check.txt"; echo '```'; } > "$RUNNER_TEMP/body.md"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
