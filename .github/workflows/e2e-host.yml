name: End-to-end (real OS)

# The tests that need a window server, or that change the account's real Dock and
# Trash. Not on every pull request: macOS minutes are expensive, and these aren't
# required until they've proven stable.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/e2e-host.yml
      - Tests/HatsE2EFake/**
      - Tests/HatsE2ETests/GUITests.swift
      - Tests/HatsE2ETests/DisposableHostTests.swift
      - Tests/HatsE2ETests/Support/**
      - Sources/HatsCore/TestSandbox.swift
      - Sources/HatsCore/DesktopLauncher.swift
      - Sources/HatsCore/Dock.swift

permissions:
  contents: read

concurrency:
  group: e2e-host-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with ci.yml and release.yml.
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  gui:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo xcode-select -s "$XCODE_APP"
          swift --version
      - name: Install just
        run: brew install just
      - name: Record the runner's state
        run: scripts/ci-host-state.sh > "$RUNNER_TEMP/host-state-before"
      - name: Real launches, activation and quits against a stub app
        run: just test --filter GUITests
        env:
          HATS_E2E_GUI: "1"
      - name: Check the tests left the runner's real state alone
        if: ${{ !cancelled() }}
        run: scripts/ci-host-state.sh | diff "$RUNNER_TEMP/host-state-before" -

  disposable-host:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo xcode-select -s "$XCODE_APP"
          swift --version
      - name: Install just
        run: brew install just
      - name: The real Dock, Trash and Launch Services
        run: just test --filter DisposableHostTests
        env:
          HATS_E2E_DISPOSABLE_HOST: "1"
