name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with release.yml so CI builds with the release toolchain.
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  # The Swift jobs skip a pull request that changes only the site. A job skipped
  # by its `if` reports success, so they stay required checks; a paths filter on
  # the workflow would leave them pending forever instead.
  changes:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request HEAD is GitHub's test merge, whose first parent is the base.
          fetch-depth: 2
          persist-credentials: false
      - name: Find what the pull request changes
        id: diff
        # Only paths known to leave Swift alone may skip, so a new path runs everything.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo swift=true
          else
            changed="$(git diff --name-only HEAD^1 HEAD)"
            if grep -qv '^site/' <<<"$changed"; then echo swift=true; else echo swift=false; fi
          fi >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    # Runs when `changes` fails, rather than skipping and passing as a required check.
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: xcode-27
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo xcode-select -s "$XCODE_APP"
          swift --version
      - name: Install just
        run: brew install just
      - name: Record the runner's state
        run: scripts/ci-host-state.sh > "$RUNNER_TEMP/host-state-before"
      - name: Test
        run: |
          # SwiftPM doesn't create the --xunit-output directory, and on macOS it fails without running tests.
          mkdir -p test-results
          just test --parallel --xunit-output test-results/junit.xml
        env:
          # Fail rather than run the end-to-end tests without their Seatbelt guard.
          HATS_E2E_REQUIRE_GUARD: "1"
      - name: TestGlance
        if: always()
        uses: testglance/action@7e7a2c7d2c4b7c26438363636d70842599fcce49 # v1
        with:
          github-token: ${{ github.token }}
      - name: Package and install through install.sh (universal)
        run: just package --arch arm64 --arch x86_64
      - name: End-to-end tests against the packaged binary
        run: just e2e --parallel
        env:
          HATS_E2E_BINARY: ${{ github.workspace }}/dist/bin/hats
      - name: Check the tests left the runner's real state alone
        # A failed test step is when this evidence matters most.
        if: ${{ !cancelled() }}
        run: scripts/ci-host-state.sh | diff "$RUNNER_TEMP/host-state-before" -

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Lint
        run: |
          brew install just shellcheck actionlint
          just lint

  # hats supports macOS only. This keeps HatsCore free of macOS-only code.
  linux:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: ubuntu-latest
    # Keep the Swift version in step with XCODE_APP's toolchain and the justfile's
    # linux_image. The steps match `just linux`, which runs them locally in Docker.
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build --target HatsCore
      - name: Test
        run: swift test --parallel
