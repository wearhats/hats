name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with release.yml so CI builds with the release toolchain.
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  test:
    runs-on: xcode-27
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo xcode-select -s "$XCODE_APP"
          swift --version
      - name: Install just
        run: brew install just
      - name: Record the runner's state
        run: scripts/ci-host-state.sh > "$RUNNER_TEMP/host-state-before"
      - name: Test
        run: |
          # SwiftPM doesn't create the --xunit-output directory, and on macOS it fails without running tests.
          mkdir -p test-results
          just test --parallel --xunit-output test-results/junit.xml
        env:
          # Fail rather than run the end-to-end tests without their Seatbelt guard.
          HATS_E2E_REQUIRE_GUARD: "1"
      - name: TestGlance
        if: always()
        uses: testglance/action@7e7a2c7d2c4b7c26438363636d70842599fcce49 # v1
        with:
          github-token: ${{ github.token }}
      - name: Package and install through install.sh (universal)
        run: just package --arch arm64 --arch x86_64
      - name: End-to-end tests against the packaged binary
        run: just e2e --parallel
        env:
          HATS_E2E_BINARY: ${{ github.workspace }}/dist/bin/hats
      - name: Check the tests left the runner's real state alone
        # A failed test step is when this evidence matters most.
        if: ${{ !cancelled() }}
        run: scripts/ci-host-state.sh | diff "$RUNNER_TEMP/host-state-before" -

  lint:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Lint
        run: |
          brew install just shellcheck actionlint
          just lint

  # hats supports macOS only. This keeps HatsCore free of macOS-only code.
  linux:
    runs-on: ubuntu-latest
    # Keep the Swift version in step with XCODE_APP's toolchain and the justfile's
    # linux_image. The steps match `just linux`, which runs them locally in Docker.
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build --target HatsCore
      - name: Test
        run: swift test --parallel

  # On every pull request, unfiltered: docs and the README feed the site's build.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Install zsh
        # The uninstall test pastes the commands into zsh, the default macOS shell.
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: Build
        run: pnpm run build
      - name: Built output, CSP, axe
        run: pnpm run test
      - name: Lighthouse
        run: pnpm run lighthouse
