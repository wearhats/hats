name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests cancel stale runs. Runs on main queue instead, so a newer push
# never cancels a deploy halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with release.yml so CI builds with the release toolchain.
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  # The Swift jobs skip a pull request that changes only the site. A job skipped
  # by its `if` reports success, so they stay required checks; a paths filter on
  # the workflow would leave them pending forever instead.
  changes:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request HEAD is GitHub's test merge, whose first parent is the base.
          fetch-depth: 2
          persist-credentials: false
      - name: Find what the pull request changes
        id: diff
        # Only paths known to leave Swift alone may skip, so a new path runs everything.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo swift=true
          else
            changed="$(git diff --name-only HEAD^1 HEAD)"
            if grep -qv '^site/' <<<"$changed"; then echo swift=true; else echo swift=false; fi
          fi >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    # Runs when `changes` fails, rather than skipping and passing as a required check.
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: xcode-27
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo xcode-select -s "$XCODE_APP"
          swift --version
      - name: Install just
        run: brew install just
      - name: Record the runner's state
        run: scripts/ci-host-state.sh > "$RUNNER_TEMP/host-state-before"
      - name: Test
        run: |
          # SwiftPM doesn't create the --xunit-output directory, and on macOS it fails without running tests.
          mkdir -p test-results
          just test --parallel --xunit-output test-results/junit.xml
        env:
          # Fail rather than run the end-to-end tests without their Seatbelt guard.
          HATS_E2E_REQUIRE_GUARD: "1"
      - name: TestGlance
        if: always()
        uses: testglance/action@7e7a2c7d2c4b7c26438363636d70842599fcce49 # v1
        with:
          github-token: ${{ github.token }}
      - name: Package and install through install.sh (universal)
        run: just package --arch arm64 --arch x86_64
      - name: End-to-end tests against the packaged binary
        run: just e2e --parallel
        env:
          HATS_E2E_BINARY: ${{ github.workspace }}/dist/bin/hats
      - name: Check the tests left the runner's real state alone
        # A failed test step is when this evidence matters most.
        if: ${{ !cancelled() }}
        run: scripts/ci-host-state.sh | diff "$RUNNER_TEMP/host-state-before" -

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Lint
        run: |
          brew install just shellcheck actionlint
          just lint

  # hats supports macOS only. This keeps HatsCore free of macOS-only code.
  linux:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.swift != 'false' }}
    runs-on: ubuntu-latest
    # Keep the Swift version in step with XCODE_APP's toolchain and the justfile's
    # linux_image. The steps match `just linux`, which runs them locally in Docker.
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: swift build --target HatsCore
      - name: Test
        run: swift test --parallel

  # On every pull request, unfiltered: docs and the README feed the site's build.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # pnpm/action-setup isn't on the org's allowed-actions list, so corepack
      # installs the pnpm that package.json pins. The store is cached here because
      # setup-node's pnpm cache needs pnpm on PATH before setup-node runs.
      - name: Set up pnpm
        id: pnpm
        run: |
          corepack enable
          pnpm --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      # The uninstall test pastes the commands into zsh, the default macOS shell.
      # No `playwright install-deps`: the runner image already has Chromium's
      # libraries, so it only added fallback fonts the tests don't use, and their
      # download alone could take minutes.
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
      - name: Build
        run: pnpm run build
      - name: Built output, CSP, axe
        run: pnpm run test
      - name: Lighthouse
        run: pnpm run lighthouse
      - name: Keep the tested build for deploy-site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Ships the build the site job tested, so nothing untested reaches wearhats.dev.
  deploy-site:
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: site
      url: https://wearhats.dev
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  site-check:
    needs: deploy-site
    if: vars.SITE_CHECK_ENABLED == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/site-check.yml
